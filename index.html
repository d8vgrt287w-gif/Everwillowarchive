:root{color-scheme:dark;--bg:#09090d;--surface:#111019;--stone:#202029;--stone2:#2f2e37;--silver:#d7d3d8;--muted:#aaa7b5;--soft:#c9bfd5;--violet:#9275af;--lilac:#c6a8dd;--accent:#d5c7df;--edge:#5e5767;--max:1220px;--serif:'Cormorant Garamond',Georgia,serif;--display:'Cinzel',Georgia,serif;--sans:'Inter',Arial,sans-serif}

.page{min-height:68vh;animation:enter .35s ease}.eyebrow{font:500 11px var(--display);letter-spacing:.35em;text-transform:uppercase;color:#c6b2d6}.section-wrap{max-width:var(--max);margin:0 auto;padding:0 26px}.section-label{font:500 12px var(--display);letter-spacing:.26em;text-transform:uppercase;text-align:center;color:#d8cddd;margin:0 0 20px}.ornament{text-align:center;color:#b8a2c9;font-family:var(--display);margin:8px auto 14px;letter-spacing:1em}.intro-copy{font-size:clamp(19px,2.2vw,25px);color:#c5bfcb;max-width:750px;margin:12px auto 0}.page-head{text-align:center;padding:66px 18px 44px;border-bottom:1px solid #665a6936;background:radial-gradient(ellipse at 50% 0,#3224366a,transparent 65%)}.page-head p{max-width:700px;margin:13px auto;color:#bbb4c5;font-size:clamp(17px,1.8vw,22px)}

const asset=(name)=>INLINE_ASSETS[name]||`assets/${name}`;
const getSaved=(key)=>{try{return localStorage.getItem(key)}catch{return null}};
const saveSaved=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const btn=(text,href,cls='stone-button')=>href?`<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(text)} <span aria-hidden="true">↗</span></a>`:`<button class="${cls}" disabled type="button" aria-label="${esc(text)}: link not available yet">Link coming soon</button>`;
const header=(title,subtitle)=>`<div class="page-head"><div class="eyebrow">The Everwillow Archive</div><h1>${esc(title)}</h1><div class="ornament" aria-hidden="true">✧</div><p>${esc(subtitle)}</p></div>`;
function renderHome(){
 const plaques=[
 ['Character Vault','Explore the lives, bonds and stories preserved here.','character-duo.webp','#characters'],
 ['Deck Archive','Commander decks, collections and the ways we play.','dragon.webp','#decks'],
 ['Written Works','Stories, manuscripts and finished books.','book-cover-concept.webp','#books'],
 ['Connections','Find Nauxinn across worlds beyond these walls.','bonsai.webp','#connections']
 ];
 return `<div class="page home"><section class="hero"><div class="hero-art" aria-hidden="true"></div><div class="hero-content"><div class="hero-copy"><h1><span>The</span>Everwillow Archive</h1><p class="hero-deck">Characters · Commander Decks · Written Works</p><p>An archive of the worlds I carry: the characters I create, the decks I build, and the stories I write.</p><a href="#archive-interior" class="stone-button" id="enter-archive">Enter the Archive <span aria-hidden="true">→</span></a></div></div><div class="hero-quote">What is written, remains.</div></section>
 <div class="homepage-content section-wrap" id="archive-interior"><div class="eyebrow" style="text-align:center;margin-bottom:10px">Beyond the stone doors</div><h2 class="section-label">Explore the Archive</h2><div class="home-plaques">${plaques.map(p=>`<a class="home-plaque gothic-frame" href="${p[3]}"><div class="plaque-visual" style="background-image:linear-gradient(0deg,#14101855,transparent),url('${asset(p[2])}')"></div><div class="plaque-inner"><h3>${p[0]}</h3><p>${p[1]}</p><span class="mini-action">Enter Section →</span></div></a>`).join('')}</div>
 <div class="sarcophagus gothic-frame"><div class="eyebrow">The keeper of the archive</div><h3>Nauxinn Everwillow</h3><p>“What is written, remains.”</p><button class="stone-button" type="button" data-modal="about">About the Archive →</button></div></div></div>`;
}
const CHARACTERS={
 'zombait-willow':{name:'Zombait & Willow',title:'Adventure Forever',image:'character-duo.webp',quote:'In every shadow, in every world, always you.',intro:'A story of an undead wanderer and the living spirit of an ancient willow: grief and renewal, magic and devotion, and the home they build together.',chapters:[['Their Chronicle','Two lives entwined through the Black Willow. The story follows Zombait and Willow through danger, loss, and the choice to keep finding each other.'],['Zombait','A Reborn warlock, survivor, and keeper of the Black Willow staff. There is darkness in his magic and remarkable tenderness in his loyalties.'],['Willow','An immortal Seedborn nature spirit anchored to an ancient willow tree, with deep green eyes, black hair, and two bright blonde streaks framing her face.'],['Relics & Gear','The Black Willow staff; their worn fish-under-tree pendant; and the little signs of a life painstakingly kept together.'],['Moments Worth Keeping','The Bond · Adventure Forever · Everwillow Estate'],['Gallery & Archive Notes','Artwork and personal notes from their ever-growing Chronicle.']]},
 'mourn':{name:'Mourn Everwillow',title:'Daughter of Darkness',image:'character-mourn.webp',quote:'I do not hide in darkness. I command it.',intro:'An undead Shadow Priest who claimed her own power amid the ruins of faith. Angry, deliberate, and never apologetic for what she became.',chapters:[['The Chronicle','A ruined Forsaken chapel, a shattered symbol of former devotion, and the decision to walk in shadow on her own terms.'],['Relics & Gear','A blackened-silver wand with a violet crystal tip, a cracked holy symbol, and a black candle with a violet-black flame.'],['Moments Worth Keeping','The Past · The Breaking Point · Daughter of Darkness'],['Gallery & Archive Notes','Painted scenes of her chapel, quiet observations, and future roleplay developments.']]},
 'naux':{name:'Naux Everwillow',title:'Light’s Shadow',image:'character-naux.webp',quote:'The Light can judge me after I’m done protecting you.',intro:'A Forsaken Protection Paladin: cynical, battle-worn, and fiercely dependable. She trusts what the Light can do, not the institutions that claim to own it.',chapters:[['From Lordaeron to the Forsaken','Once a human holy knight of The Righteous Arm of Light, Naux fell fighting the Scourge during the fall of Lordaeron. Raised and enslaved, she eventually regained her freedom alone amid the ruins.'],['Faith Without Devotion','The order’s High Cleric expelled her because she had become Forsaken. Naux let the order’s insignia fall to the floor. As cold white Light moved through the scars in her armor, she replied: “The Light disagrees.” Her departing steps briefly burned with white holy fire edged in Forsaken green.'],['Choosing Protection','Despite distrust on every side, she stepped between danger and the people who needed her. Steel and magic struck her battered shield, and she found a purpose stronger than approval.'],['Light’s Shadow','At a breached and fortified cathedral, Naux held the line until everyone else was safe. Only after the battle did holy fire touch the ground beneath her departing steps.'],['Relics & Gear','Oathscar: her scarred, well-maintained sword bearing the original Everwillow maker’s mark. The Unbroken: her repaired shield, wrapped with broken prayer beads and inscribed by her own hand: “Still here.”'],['Bonds & Allies','Few bonds, carefully earned. Ordinary Forsaken came to trust her because she defended them despite their suspicion of her holy magic.'],['Gallery & Archive Notes','The Unbroken beside the ruined altar; cold moonlight across damaged steel. Nauxinn’s observations remain restrained and purely archival.']]}
};
function renderCharacters(){const info=[['zombait-willow','Zombait & Willow','Adventure Forever','A shared Chronicle of love, death, and renewal.'],['mourn','Mourn Everwillow','Daughter of Darkness','An angry Shadow Priest commanding the darkness.'],['naux','Naux Everwillow','Light’s Shadow','A Forsaken guardian who refuses to yield.']];return `<div class="page">${header('The Character Vault','A portrait hall for the characters who call the Archive home.')}
<div class="character-gallery section-wrap"><div class="character-grid">${info.map(([key,name,subtitle,desc])=>`<article class="character-card gothic-frame"><img src="${asset(CHARACTERS[key].image)}" alt="Illustrated portrait concept of ${esc(name)}" loading="lazy"><div class="character-body"><h2>${esc(name)}</h2><div class="subtitle">${esc(subtitle)}</div><p>${esc(desc)}</p><a class="stone-button" href="#chronicle/${key}">View Chronicle →</a></div></article>`).join('')}</div><p class="brief">These are initial concept portraits. Final character artwork will be updated to match the established appearances as we prepare the full galleries.</p></div></div>`}
function renderChronicle(key){const c=CHARACTERS[key];if(!c)return renderCharacters();const hidden=key==='naux'?`<section class="chapter"><div class="eyebrow">A page untouched by ink</div><h2>The Unwritten Page</h2><p>There is one memory the archivist has never recorded. Something beneath the parchment has not entirely faded.</p><button class="unwritten" id="unwritten-trigger" type="button" aria-label="Examine the faint handprint on the damaged parchment"><span class="handprint ${getSaved('everwillow-naux-unwritten')?'revealed':''}" aria-hidden="true">☛</span><small>${getSaved('everwillow-naux-unwritten')?'Return to the hidden memory':'A faint handprint beneath the page'}</small></button></section>`:'';return `<div class="page chronicle">${header(c.name,c.title)}<div class="section-wrap"><div class="chronicle-hero"><img class="gothic-frame" src="${asset(c.image)}" alt="${esc(c.name)} portrait concept"><div class="story-head"><div class="eyebrow">The Character Vault · A preserved Chronicle</div><h1>${esc(c.name)}</h1><blockquote>“${esc(c.quote)}”</blockquote><p>${esc(c.intro)}</p><div class="chronicle-links"><a href="#characters" class="text-button">← Back to the Vault</a></div></div></div>${c.chapters.map((section,i)=>`<section class="chapter"><div class="eyebrow">Archive entry ${String(i+1).padStart(2,'0')}</div><h2>${esc(section[0])}</h2><p>${esc(section[1])}</p></section>`).join('')}${hidden}<p class="brief">This is the working website edition of the Chronicle; dedicated galleries and additional illustrated scenes will be expanded later.</p></div></div>`}
function renderDecks(){const feat=DATA.decks.filter(d=>d.featured),other=DATA.decks.filter(d=>!d.featured);const frame=d=>`<button type="button" class="commander-frame ${esc(d.color)}" data-deck="${esc(d.id)}" aria-label="Open the deck summary for ${esc(d.name)}"><img src="${asset(d.image)}" alt="Fantasy portrait concept inspired by ${esc(d.name)}" loading="lazy"><span class="nameplate"><strong>${esc(d.name)}</strong><small>${esc(d.sub)}</small></span></button>`;return `<div class="page">${header('The Deck Archive','A gallery of Commander decks, and the other builds carried into battle.')}
<div class="deck-room"><div class="section-wrap"><div class="deck-wall"><div class="section-label">The Commander Gallery</div><div class="feature-row">${feat.map(frame).join('')}</div><div class="support-row">${other.map(frame).join('')}</div><div class="arsenal"><h2>The Arsenal</h2><div class="arsenal-shelf">${DATA.arsenal.map(d=>`<button class="arsenal-item" type="button" data-deck="${esc(d.id)}" aria-label="Open the deck summary for ${esc(d.name)}"><img loading="lazy" src="${asset(d.image)}" alt="${esc(d.archetype)} illustration"><span>${esc(d.name)} →</span></button>`).join('')}</div></div></div><p class="brief">Select any portrait for a short deck overview and its Moxfield link. Smaug is my favoured Commander; Morska is where it all began.</p></div></div></div>`}
function renderRunes(bracket,color){const glow={rakdos:'#eeb27b',bant:'#8bcad0',shadow:'#c6b3d5',grixis:'#b879aa',simic:'#94cfaa','mono-white':'#f4e5b3'}[color]||'#d4c6dc';return `<div class="runes" style="--rune-glow:${glow}" aria-label="Five Everwillow Commander bracket runes">${Array.from({length:5},(_,i)=>`<span class="${bracket!==null&&i<bracket?'lit':''}" aria-hidden="true">${['ᚹ','ᛉ','ᛟ','ᛜ','ᛞ'][i]}</span>`).join('')}</div><div class="bracket-caption">${bracket===null?'Official Commander bracket: awaiting decklist review':`Commander Bracket ${bracket}`}</div>`}
function showDeck(id,trigger){const d=[...DATA.decks,...DATA.arsenal].find(x=>x.id===id);if(!d)return;const isCommander=d.format==='Commander';openModal(`<div class="modal-deck"><img src="${asset(d.image)}" alt="Illustrative portrait of ${esc(d.name)}"><div><div class="eyebrow">${esc(d.format)} · The Deck Archive</div><h2 id="modal-title">${esc(d.name)}</h2><p class="engraved">${esc(d.archetype)}</p><p>${esc(d.description)}</p>${isCommander?renderRunes(d.bracket,d.color):''}<div class="meta-grid"><div><small>Format</small><span>${esc(d.format)}</span></div><div><small>${isCommander?'Relic':'Theme'}</small><span>${esc(isCommander?d.relic:d.archetype)}</span></div></div><div class="action-area">${btn('View on Moxfield',d.moxfield)}${!d.moxfield?'<span class="muted-note">The Moxfield link will be added when you provide it.</span>':'<span class="muted-note">Opens the decklist in a new tab.</span>'}</div></div></div>`,trigger)}
function renderBooks(){const novels=DATA.books.filter(x=>x.kind==='novel');const activity=DATA.books.filter(x=>x.kind!=='novel');const spines=list=>`<div class="shelf-books"><span class="bookend" aria-hidden="true">❧</span>${list.map(b=>`<button class="book-spine ${esc(b.spine)} ${b.status==='work-in-progress'?'manuscript':''}" data-book="${esc(b.id)}" type="button" aria-label="Read about ${esc(b.title)}"><strong>${esc(b.title)}</strong><small>${b.volume?'Vol. '+b.volume:''}</small></button>`).join('')}<span class="bookend" aria-hidden="true">❧</span></div>`;return `<div class="page">${header('The Written Works','Stories, manuscripts, coloring books, scorebooks and other pages worth preserving.')}
<div class="library section-wrap"><div class="stone-wall"><div class="stone-row-title">Novels & Stories</div>${spines(novels)}<div class="stone-row-title">Coloring Books, Scorebooks & Activity Books</div>${spines(activity)}</div><p class="brief">Select a book spine to see its cover, a synopsis, and publication details. Unreleased works remain rough-bound manuscripts until finished.</p></div></div>`}
function showBook(id,trigger){const b=DATA.books.find(x=>x.id===id);if(!b)return;const isWip=b.status==='work-in-progress';const cover=b.cover?`<div class="book-cover"><small>${esc(b.series)}</small><h3>${esc(b.title)}</h3><small>Cover concept · not final</small></div>`:`<div class="book-cover plain"><small>${esc(b.series)}</small><div class="sigil" aria-hidden="true">❦</div><h3>${esc(b.title)}</h3><small>Cover artwork pending</small></div>`;openModal(`<div class="modal-book">${cover}<div><div class="eyebrow">${esc(b.kind==='novel'?'Novel & Story':'Published Works Collection')}</div><h2 id="modal-title">${esc(b.title)}</h2><p class="engraved">${esc(b.series)}${b.volume?' · Book '+b.volume:''}</p>${b.author?`<p style="font-size:17px;margin:7px 0">By ${esc(b.author)}</p>`:''}<p>${esc(b.synopsis)}</p><div class="status-line">${isWip?'Unreleased · Work in Progress':'Publication listing link pending'}</div><div class="action-area">${isWip?'<button class="stone-button" disabled type="button">Work in Progress</button>':btn('View on Amazon',b.amazon)}${!isWip&&!b.amazon?'<span class="muted-note">We’ll enable this once the correct Amazon listing is provided.</span>':''}</div></div></div>`,trigger)}
function renderConnections(){return `<div class="page"><div class="connections-hero"><div class="connections-head"><div class="eyebrow">Paths beyond the Archive</div><h1>Connections</h1><p>Find Nauxinn Everwillow across the many worlds beyond these walls.</p></div><img src="${asset('bonsai.webp')}" alt="A miniature weeping willow in an ornate gothic pot beside a moonlit study"></div><div class="section-wrap"><section class="identity gothic-frame"><div class="eyebrow">Usually lurking in the Archive</div><h2>Nauxinn Everwillow</h2><p>A gamer, deck builder, writer, and collector of characters and stories. Probably building a deck, rolling dice, writing something, or getting lost in Azeroth.</p></section><div class="connections-grid">${DATA.socials.map(s=>`<article class="social-card gothic-frame"><div class="social-mark ${esc(s.className)}" aria-hidden="true">${esc(s.monogram)}</div><h3>${esc(s.name)}</h3><p>${esc(s.caption)}</p>${s.url?btn('Visit '+s.name,s.url):`<button class="stone-button" disabled type="button" aria-label="${esc(s.name)} profile not connected yet">Link coming soon</button>`}</article>`).join('')}</div></div></div>`}
function showAbout(trigger){openModal(`<div><div class="eyebrow">The keeper’s record</div><h2 id="modal-title">About the Archive</h2><p style="margin-top:18px">The Everwillow Archive is a home for everything carried from one world into another: Magic: The Gathering decks, characters from roleplaying and games, writing projects, and the connections made along the way.</p><p style="margin-top:14px">Known online as <strong>Nauxinn Everwillow</strong>, its keeper preserves these stories under a simple belief:</p><blockquote style="font:italic 30px var(--serif);border-left:2px solid #b9a3c6;padding-left:16px;margin:20px 0">“What is written, remains.”</blockquote></div>`,trigger)}
function showMemory(trigger){saveSaved('everwillow-naux-unwritten','1');trigger?.querySelector('.handprint')?.classList.add('revealed');openModal(`<div><div class="eyebrow">The Unwritten Page · A private memory</div><h2 id="modal-title">The Voice That Knew Her</h2><p style="margin-top:20px">The Scourge advances. Beneath a will that is not her own, Naux raises her blade toward a familiar knight.</p><p style="margin-top:17px">Someone recognizes her. A voice calls out from the smoke: <em>“Naux?”</em></p><p style="margin-top:17px">For a brief moment, a cold white Light breaks through her damaged armor. She forces her weapon aside. The knight escapes into the battlefield mist. Whether they survived, she never learned.</p><div class="ornament" aria-hidden="true">✧</div><p style="text-align:center;font-size:30px;font-style:italic;color:#e4d9ec">“Naux?”</p><p class="muted-note" style="text-align:center;margin-top:12px">Nauxinn has never recorded this memory. The visitor alone has seen it.</p></div>`,trigger)}
function openModal(html,trigger){modalTrigger=trigger||document.activeElement;dialogContent.innerHTML=html;dialogScrim.hidden=false;document.body.classList.add('modal-open');dialog.focus();}
function closeModal(){if(dialogScrim.hidden)return;dialogScrim.hidden=true;document.body.classList.remove('modal-open');dialogContent.innerHTML='';if(modalTrigger?.isConnected)modalTrigger.focus();modalTrigger=null;}
function navigate(){let raw=decodeURIComponent((location.hash||'#home').slice(1));if(raw==='archive-interior'){if(activeRoute!=='home')renderRoute('home');requestAnimationFrame(()=>document.getElementById('archive-interior')?.scrollIntoView({behavior:'smooth'}));return;}const [route,sub]=raw.split('/');renderRoute(['home','characters','decks','books','connections','chronicle'].includes(route)?route:'home',sub);}
function renderRoute(route,sub){closeModal();activeRoute=route;const page={home:renderHome,characters:renderCharacters,decks:renderDecks,books:renderBooks,connections:renderConnections,chronicle:()=>renderChronicle(sub)}[route]();main.innerHTML=page;document.querySelectorAll('[data-nav]').forEach(el=>{const isCurrent=el.dataset.nav===(route==='chronicle'?'characters':route);el.classList.toggle('active',isCurrent);if(isCurrent)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});document.title=`${route==='home'?'The Everwillow Archive':route==='chronicle'?(CHARACTERS[sub]?.name||'Chronicle'):({characters:'The Character Vault',decks:'The Deck Archive',books:'The Written Works',connections:'Connections'}[route])} — Everwillow Archive`;mobileMenu.hidden=true;toggle.setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'});}
toggle.addEventListener('click',()=>{const expanded=toggle.getAttribute('aria-expanded')==='true';mobileMenu.hidden=expanded;toggle.setAttribute('aria-expanded',String(!expanded));toggle.setAttribute('aria-label',expanded?'Open navigation menu':'Close navigation menu');});
mobileMenu.addEventListener('click',e=>{if(e.target.closest('a')){mobileMenu.hidden=true;toggle.setAttribute('aria-expanded','false')}});
document.addEventListener('click',e=>{const d=e.target.closest('[data-deck]');const b=e.target.closest('[data-book]');const about=e.target.closest('[data-modal="about"]');const u=e.target.closest('#unwritten-trigger');if(d)showDeck(d.dataset.deck,d);else if(b)showBook(b.dataset.book,b);else if(about)showAbout(about);else if(u)showMemory(u)});
document.getElementById('modal-close').addEventListener('click',closeModal);
dialogScrim.addEventListener('click',e=>{if(e.target===dialogScrim)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!dialogScrim.hidden)closeModal();else if(!mobileMenu.hidden){mobileMenu.hidden=true;toggle.setAttribute('aria-expanded','false')}}if(e.key==='Tab'&&!dialogScrim.hidden){const list=[...dialog.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!list.length){e.preventDefault();return;}const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
window.addEventListener('hashchange',navigate);navigate();
</script></body>
</html>
